<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemDoping V2 — Demo</title>
<style>
:root{
  color-scheme: light;
  --cream:#F7F2E8; --blue:#0452C3; --blue-lt:#00AFFD; --blue-dp:#02217B;
  --navy:#011049; --pink:#FD7789;
  --ink:#011049; --warm:#6B6250; --rule:#DDD5C4;
  --c1:var(--pink); --c2:var(--blue-lt); --c3:#FFC53D; --c4:var(--blue); --c5:#31D07A;
  --glow:rgba(253,119,137,.34); --sheen:rgba(255,255,255,.55);
}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);overflow-x:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:4px 2px 30px;position:relative;z-index:1}
.head{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.head img{width:42px;height:auto;filter:drop-shadow(0 2px 4px rgba(1,16,73,.2))}
h1{font-size:19px;margin:0}
.sub{color:var(--warm);font-size:12px;margin:1px 0 0}
.lang{margin-left:auto;display:flex;border:1.5px solid var(--rule);border-radius:99px;overflow:hidden}
.lang button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;
  padding:6px 13px;cursor:pointer;color:var(--warm)}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}

.amb{position:fixed;inset:0;pointer-events:none;z-index:0;perspective:900px;overflow:hidden}
.amb i{position:absolute;width:60px;height:60px;transform-style:preserve-3d;
  animation:drift linear infinite;opacity:.16}
.amb i::before,.amb i::after{content:"";position:absolute;inset:0;border-radius:14px}
.amb i::before{background:linear-gradient(145deg,var(--pink),var(--blue));transform:translateZ(16px)}
.amb i::after{background:linear-gradient(145deg,var(--blue-lt),var(--c3));transform:translateZ(-16px)}
@keyframes drift{0%{transform:translate3d(0,110vh,0) rotateX(0) rotateY(0)}
  100%{transform:translate3d(0,-25vh,0) rotateX(360deg) rotateY(540deg)}}

.paths{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;perspective:900px}
.path{flex:1;min-width:180px;border:0;border-radius:15px;padding:11px 13px;cursor:pointer;
  text-align:left;font-family:inherit;color:#fff;transform-style:preserve-3d;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s}
.path:hover{transform:translateZ(18px) rotateX(-7deg)}
.path[aria-selected="true"]{transform:translateZ(26px) rotateX(-4deg);box-shadow:0 16px 34px -10px var(--glow)}
.path b{display:block;font-size:14.5px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.path span{font-size:11px;opacity:.93}

.stage{border-radius:19px;overflow:hidden;perspective:1250px;transition:background .45s;position:relative}
.bar{display:flex;align-items:center;gap:9px;padding:9px 14px;flex-wrap:wrap;
  font-size:12px;color:#fff;background:rgba(1,16,73,.28)}
.chip{padding:2px 10px;border-radius:99px;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.steps{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.step{font-size:9.5px;padding:2px 7px;border-radius:99px;opacity:.4;border:1px solid currentColor;white-space:nowrap}
.step.on{opacity:1;font-weight:800;background:rgba(255,255,255,.2)}
.screen{padding:20px;min-height:360px;display:flex;flex-direction:column;transform-style:preserve-3d}
.story{font-size:12.5px;color:#fff;opacity:.92;background:rgba(1,16,73,.22);
  padding:7px 13px;display:flex;gap:8px;align-items:center}
.story em{font-style:normal;font-size:15px}
.lead{font-size:12.5px;opacity:.78;margin:0 0 4px;color:#fff}
.big{font-size:22px;font-weight:800;margin:0 0 12px;line-height:1.25;color:#fff;
  text-shadow:0 2px 10px rgba(1,16,73,.35)}
.mid{font-size:16px;font-weight:650;margin:0 0 10px;color:#fff}

.narr{display:flex;gap:13px;align-items:flex-start;margin-bottom:12px}
.mascot{width:88px;flex:0 0 88px;position:relative;transform-origin:50% 88%}
.mascot img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(1,16,73,.34))}
.mascot.idle{animation:bob 3.2s ease-in-out infinite}
.mascot.talk{animation:talk .42s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes talk{0%,100%{transform:translateY(0) scale(1,1) rotate(-2deg)}
  50%{transform:translateY(-4px) scale(1.04,.96) rotate(2deg)}}
.bubble{flex:1;position:relative;background:#fff;border-radius:15px;padding:13px 15px;
  font-size:15px;color:var(--navy);box-shadow:0 10px 24px -14px rgba(1,16,73,.7);min-height:54px}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;width:16px;height:16px;
  background:#fff;transform:rotate(45deg)}
.bubble .ctl{display:flex;gap:7px;margin-top:9px;align-items:center}
.mini{border:1.5px solid var(--rule);background:#fff;border-radius:99px;font:inherit;
  font-size:11.5px;padding:4px 11px;cursor:pointer;color:var(--navy)}
.vol{font-size:11px;color:var(--warm);margin-left:auto}

.demo{position:relative;height:180px;border-radius:16px;overflow:hidden;margin-bottom:11px;
  background:rgba(1,16,73,.17);perspective:800px}
.demo *{position:absolute}
.replay{position:absolute;top:7px;right:8px;z-index:5;font-size:11px;padding:4px 9px;
  border-radius:99px;border:0;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.88);color:var(--navy)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;font-size:12.5px;
  color:#fff;background:rgba(1,16,73,.42)}
.d-card{padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:650;color:var(--navy);
  background:linear-gradient(150deg,var(--sheen),transparent 45%),var(--dc,#fff);
  box-shadow:0 4px 0 -1px color-mix(in srgb,var(--dc,#fff) 55%,#000);white-space:nowrap}
.d-slot{width:34px;height:34px;border-radius:9px;border:2px dashed rgba(255,255,255,.45);
  display:grid;place-items:center;font-size:16px}
.d-hand{font-size:22px;z-index:4;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));opacity:0}
.d-line{height:3px;border-radius:9px;background:var(--c3);transform-origin:left center;transform:scaleX(0)}
@keyframes dFly{0%{opacity:0;transform:translate(0,50px) scale(.8)}22%{opacity:1}
  55%,100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes dLand{0%,44%{opacity:.25;border-style:dashed}
  56%,100%{opacity:1;border-style:solid;border-color:transparent;background:var(--c5)}}
@keyframes dTap{0%,55%{opacity:0;transform:translateY(12px)}66%{opacity:1;transform:translateY(0)}
  76%{opacity:1;transform:translateY(-5px)}90%,100%{opacity:0}}
@keyframes dMark{0%,40%{opacity:0;transform:scale(.5)}55%,100%{opacity:1;transform:scale(1)}}
@keyframes dSplit{0%,30%{word-spacing:0}62%,100%{word-spacing:22px}}
@keyframes dDraw{0%,30%{transform:scaleX(0)}62%,100%{transform:scaleX(1)}}
@keyframes dIn{0%{opacity:0;transform:translateX(52px) scale(.7)}34%,100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes dLetter{0%{opacity:0;transform:translate(var(--fx),40px) scale(.6)}
  40%,100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes dGlow{0%,40%{filter:none;transform:scale(1)}
  60%{filter:drop-shadow(0 0 12px var(--c3));transform:scale(1.14)}
  100%{filter:drop-shadow(0 0 6px var(--c3));transform:scale(1.06)}}

.opts{display:flex;flex-direction:column;gap:9px;transform-style:preserve-3d}
.opts.row{flex-direction:row;flex-wrap:wrap}
.tile{border:0;border-radius:14px;padding:13px 15px;cursor:pointer;font-size:14.5px;
  text-align:left;font-family:inherit;color:var(--navy);display:flex;align-items:center;gap:11px;
  transform-style:preserve-3d;position:relative;
  background:linear-gradient(160deg,var(--sheen),transparent 42%),
             linear-gradient(160deg,var(--tc,#fff),color-mix(in srgb,var(--tc,#fff) 70%,#000));
  box-shadow:0 8px 0 -2px color-mix(in srgb,var(--tc,#fff) 55%,#000),
             0 14px 26px -12px rgba(1,16,73,.5);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4)}
.tile:hover{transform:translateZ(16px) translateY(-3px) rotateX(-5deg)}
.tile em{font-style:normal;font-size:21px;line-height:1}
.tile.ok{animation:flipOK .62s cubic-bezier(.3,.9,.3,1.1) forwards}
.tile.no{animation:shake .34s}
.tile.dim{opacity:.32;pointer-events:none;filter:grayscale(.7)}
@keyframes flipOK{0%{transform:rotateY(0) translateZ(0)}
  55%{transform:rotateY(180deg) translateZ(44px) scale(1.07)}
  100%{transform:rotateY(360deg) translateZ(0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotateZ(-2deg)}
  60%{transform:translateX(8px) rotateZ(2deg)}}

.card{border-radius:15px;padding:15px 16px;font-size:15px;margin-bottom:12px;color:var(--navy);
  background:linear-gradient(160deg,rgba(255,255,255,.93),rgba(255,255,255,.78));
  box-shadow:0 12px 26px -14px rgba(1,16,73,.6);transform:translateZ(8px)}
.fix{border-left:4px solid var(--c3);border-radius:11px;padding:12px 14px;font-size:13px;
  margin-top:11px;color:var(--navy);background:rgba(255,255,255,.95);
  box-shadow:0 14px 30px -16px rgba(1,16,73,.7);animation:rise .26s}
.fix b{display:block;margin-bottom:3px}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0) translateZ(20px)}}

.slots{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;min-height:50px;perspective:700px}
.slot{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:rgba(255,255,255,.2);border:2px dashed rgba(255,255,255,.45);transform-style:preserve-3d}
.slot.filled{border-style:solid;border-color:transparent;animation:land .42s cubic-bezier(.2,.9,.3,1.4);
  background:linear-gradient(160deg,var(--sheen),transparent 45%),var(--c5);
  box-shadow:0 6px 0 -1px color-mix(in srgb,var(--c5) 55%,#000)}
@keyframes land{0%{transform:translateZ(70px) translateY(-28px) rotateX(50deg);opacity:0}
  100%{transform:translateZ(0) translateY(0) rotateX(0);opacity:1}}

.obj{width:104px;height:104px;margin:4px auto 12px;position:relative;
  transform-style:preserve-3d;animation:spin 14s linear infinite}
.obj.fast{animation-duration:6s}
.obj u{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;
  font-size:42px;text-decoration:none;
  background:linear-gradient(150deg,var(--sheen),transparent 45%),var(--of,var(--blue-lt));
  box-shadow:0 0 34px -6px var(--glow)}
.obj u:nth-child(1){transform:translateZ(32px)}
.obj u:nth-child(2){transform:rotateY(90deg) translateZ(32px);opacity:.92}
.obj u:nth-child(3){transform:rotateY(180deg) translateZ(32px);opacity:.86}
.obj u:nth-child(4){transform:rotateY(270deg) translateZ(32px);opacity:.92}
@keyframes spin{from{transform:rotateX(-16deg) rotateY(0)}to{transform:rotateX(-16deg) rotateY(360deg)}}

.reward{margin:auto;text-align:center;transform-style:preserve-3d}
.combo{font-size:12.5px;font-weight:900;padding:4px 13px;border-radius:99px;color:var(--navy);
  background:linear-gradient(140deg,var(--c3),var(--pink));display:inline-block;
  animation:pulse .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pulse{0%{transform:scale(.6)}60%{transform:scale(1.22) translateZ(34px)}100%{transform:scale(1)}}
.meter{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin:15px auto 0;max-width:240px}
.meter i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--c5),var(--blue-lt),var(--c3));
  transition:width 1s cubic-bezier(.2,.8,.3,1)}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;perspective:600px}
.conf s{position:absolute;width:11px;height:16px;text-decoration:none;border-radius:3px;
  animation:fall 1.5s ease-in forwards;transform-style:preserve-3d}
@keyframes fall{0%{transform:translateY(-20px) rotateX(0);opacity:1}
  100%{transform:translateY(330px) rotateX(640deg) rotateZ(280deg);opacity:0}}

.foot{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
button.go{border:0;border-radius:13px;padding:12px 21px;font-size:14.5px;font-weight:800;
  cursor:pointer;font-family:inherit;color:#fff;transform-style:preserve-3d;
  background:linear-gradient(150deg,var(--blue-lt),var(--blue));
  box-shadow:0 8px 0 -2px var(--blue-dp),0 16px 28px -14px rgba(1,16,73,.6);
  transition:transform .15s cubic-bezier(.2,.9,.3,1.4)}
button.go:hover{transform:translateZ(14px) translateY(-3px)}
button.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;border:1.5px solid rgba(255,255,255,.45)}
.tick{font-size:11.5px;color:#fff;opacity:.72;margin-left:auto}

.levels{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.lv{font-size:11.5px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--rule);
  cursor:pointer;background:var(--cream);font-family:inherit;color:var(--ink)}
.lv[aria-current="true"]{border-color:var(--blue);font-weight:800}
.lv.done::after{content:" ✓";color:#1F9254}
.note{font-size:11.5px;color:var(--warm);margin-top:15px;line-height:1.6;
  border-top:1px solid var(--rule);padding-top:11px}
.note b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.amb{display:none}}
@media (max-width:520px){
  body{font-size:16px}.wrap{padding:2px 10px 26px}
  h1{font-size:16px}.head img{width:34px}
  .path{min-width:0;flex:1 1 0;padding:9px 8px}
  .path b{font-size:12.5px}.path span{font-size:9.5px;display:block;line-height:1.25}
  .screen{padding:15px 13px;min-height:0}.big{font-size:19px}
  .narr{gap:9px}.mascot{width:64px;flex-basis:64px}.bubble{font-size:14.5px;padding:11px 13px}
  .tile{padding:15px 14px;min-height:54px}.opts.row .tile{flex:1 1 100%}
  .demo{height:158px}.obj{width:84px;height:84px}.obj u{font-size:33px}
  button.go{padding:14px 20px;min-height:52px}
}
</style>
</head>
<body>
<div class="amb" id="amb"></div>
<div class="wrap">
  <div class="head">
    <img id="logo" alt="MemDoping">
    <div><h1>MemDoping V2</h1><p class="sub" id="sub"></p></div>
    <div class="lang">
      <button data-l="tr" aria-pressed="true">TR</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="paths" role="tablist" id="paths"></div>
  <div class="levels" id="levels"></div>
  <div class="stage" id="stage">
    <div class="bar" id="bar"></div>
    <div class="story" id="storybar"></div>
    <div class="screen" id="screen"></div>
  </div>
  <p class="note" id="note"></p>
</div>

 {t:{tr:"Neden Böyle?",en:"Why Is That?"},kind:"pick",tech:{tr:"Elaborasyon",en:"Elaboration"},obj:"📚",
  sci:{tr:"Ayrıntılandırıcı sorgulama: 'neden' diye sormak olguyu bildiklerine bağlar. Ölçülü bir katkı, tanıdık konularda en iyi.",
       en:"Elaborative interrogation: asking 'why' links facts to what you know. A moderate benefit, best on familiar material."},
  hook:{tr:"Her kayıt bir 'neden' saklıyor.",en:"Every record hides a 'why'."},
  tut:{tr:"Nedeni kendin bulduğunda, olgu bir yere tutunur.",en:"When you work out the reason, the fact gets something to hold on to."},
  prompt:{tr:"🦉 Baykuşlar gece avlanır",en:"🦉 Owls hunt at night"},ask:"whyIs",
  opts:[{x:{tr:"gözleri karanlıkta iyi görür",en:"their eyes see well in the dark"},ok:true},
        {x:{tr:"güneşten korkarlar",en:"they are afraid of the sun"},ok:false},
        {x:{tr:"siyah rengi severler",en:"they like the colour black"},ok:false}],
  why:{tr:"Sağlam neden, olguyu zaten bildiğin bir şeye bağlayandır. Diğerleri kulağa hoş gelir ama hiçbir yere bağlanmaz.",
       en:"The sound reason ties the fact to something you already know. The others sound fine but connect to nothing."}},
 {t:{tr:"Zincir",en:"The Chain"},kind:"order",tech:{tr:"Hikâye Zincirleme",en:"Story Linking"},obj:"🔗",
  sci:{tr:"Bower & Clark: hikâye kuran grup listeyi çok daha fazla hatırladı — klasik bir çalışmadan çarpıcı bir sonuç.",

  hook:{tr:"Dağınık kayıtları tek bir zincire dizelim.",en:"Chain the scattered records into one line."},

       en:"Don't memorise a list — build a story. The story carries the order for you."},
  goal:{tr:"Hikâyeyi sırayla kur",en:"Build the story in order"},
  steps:[{e:"🗝️",x:{tr:"Anahtar kapıyı açtı",en:"The key opened the door"},w:{tr:"Hikâye buradan başlıyor.",en:"The story starts here."}},
         {e:"📜",x:{tr:"Kapının ardında bir tomar vardı",en:"Behind the door was a scroll"},w:{tr:"Kapı açılmadan tomar görünmez.",en:"The scroll isn't visible until the door opens."}},
         {e:"🕯️",x:{tr:"Tomarı mumla okudu",en:"He read it by candlelight"},w:{tr:"Önce tomarı bulman gerek.",en:"You need the scroll first."}},
         {e:"🗺️",x:{tr:"Yazıda bir harita vardı",en:"The writing held a map"},w:{tr:"Zincirin son halkası.",en:"The last link in the chain."}}],
  traps:[{e:"⚓️",x:{tr:"Gemi limandan ayrıldı",en:"The ship left the harbour"},w:{tr:"Bu zincirde böyle bir halka yok.",en:"There's no such link in this chain."}}]},
 {t:{tr:"Geri Dön",en:"Come Back"},kind:"binary",tech:{tr:"Aralıklı Tekrar",en:"Spaced Review"},obj:"⏳",
  sci:{tr:"Genişleyen aralıklarla tekrar, unutma eğrisini düzleştirir (Cepeda ve ark.). Geciken tekrar ertelenir, cezalandırılmaz.",
       en:"Reviewing at widening intervals flattens the forgetting curve (Cepeda et al.). A late review is deferred, never punished."},
  hook:{tr:"Dünkü kayıtların vakti geldi.",en:"Yesterday's records are due."},
  tut:{tr:"Tam unutmak üzereyken geri gelirler. Hatırlayamamak da bilgi — aralık kısalır.",
       en:"They return just as you're about to forget. Failing is information too — the interval shortens."},
  q:{tr:"Hatırlıyor musun?",en:"Do you remember it?"},
  items:[{e:"🪐",n:{tr:"Satürn",en:"Saturn"},a:true},{e:"🦋",n:{tr:"Kelebek",en:"Butterfly"},a:true},
         {e:"🐙",n:{tr:"Ahtapot",en:"Octopus"},a:true}],

let lang="tr",path="child",lvl=0,step=0,idx=0,combo=0,best=0,done={},muted=false;
const $=id=>document.getElementById(id);
const W=()=>WORLDS[path], T=()=>UI[lang];
const tx=o=>typeof o==="string"?o:(o&&o[lang])||"";
const tempo=ms=>Math.round(ms*W().tempo);
const pick=i=>W().c[i%5];

let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];} }
loadVoices(); if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
function say(t){
  if(muted||!window.speechSynthesis||!t) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/[\p{Emoji}‍]/gu,''));
    u.lang=lang==="tr"?"tr-TR":"en-US";
    const v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang==="tr"?"tr":"en"));
    if(v)u.voice=v;
    u.rate=W().voice.rate; u.pitch=W().voice.pitch;
    const m=document.querySelector('.mascot');
    if(m){m.classList.remove('idle');m.classList.add('talk');}
    u.onend=u.onerror=()=>{const mm=document.querySelector('.mascot');
      if(mm){mm.classList.remove('talk');mm.classList.add('idle');}};
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ try{speechSynthesis.cancel();}catch(e){} }

function ambient(){ $('amb').innerHTML=Array.from({length:9},(_,i)=>
  `<i style="left:${6+i*11}%;animation-duration:${17+i*3.5}s;animation-delay:${-i*4}s;
     width:${34+i*7}px;height:${34+i*7}px"></i>`).join(''); }

function chrome(){
  const w=W(),r=document.documentElement.style;
  w.c.forEach((c,i)=>r.setProperty(`--c${i+1}`,c));
  r.setProperty('--glow',w.c[0]+'66');
  $('stage').style.background=w.sky;
  $('sub').textContent=T().sub; $('note').innerHTML=T().note;
  document.documentElement.lang=lang;
  $('paths').innerHTML=Object.entries(WORLDS).map(([k,v])=>
    `<button class="path" role="tab" aria-selected="${k===path}" data-p="${k}"
       style="background:${v.sky}"><b>${v[lang].label}</b><span>${v[lang].hint}</span></button>`).join('');
  $('levels').innerHTML=L[path].map((x,i)=>
    `<button class="lv ${done[path+i]?'done':''}" aria-current="${i===lvl}" data-l="${i}">
       ${i+1}. ${tx(x.t)}</button>`).join('');
  const s=L[path][lvl];
  $('bar').innerHTML=`<span class="chip" style="background:${w.chip}">${w[lang].label}</span>
    <b>${tx(s.t)}</b><span style="opacity:.75;font-size:11.5px">${tx(s.tech)}</span>
    <span class="steps">${T().flow.map((f,i)=>`<span class="step ${i===step?'on':''}">${f}</span>`).join('')}</span>`;
  $('storybar').innerHTML=`<em>📖</em><span>${ARC[path][lang][lvl]}</span>`;
}
function go(s){ hush(); step=s; chrome(); render(); }
function render(){
  const s=L[path][lvl],S=$('screen');
  if(step===0)return hook(s,S);
  if(step===1)return tut(s,S);
  if(step<5)return play(s,S);
  return reward(S);
}
const ramp=()=>step===3;
function obj3d(i,f){return `<div class="obj ${f?'fast':''}" style="--of:${pick(1)}">
  <u>${i}</u><u>${i}</u><u>${i}</u><u>${i}</u></div>`;}

function hook(s,S){
  S.innerHTML=`<div class="reward">${obj3d(s.obj,path==="teen")}
    <p class="big">${tx(s.hook)}</p><button class="go" id="n">${T().start}</button>
    <div class="tick" style="margin:9px 0 0">${T().hookTick}</div></div>`;
  say(tx(s.hook)); $('n').onclick=()=>go(1);
  setTimeout(()=>{if(step===0)go(1);},tempo(3800));
}
function tut(s,S){
  S.innerHTML=`<p class="lead">${T().micro}</p>
    <div class="narr"><div class="mascot idle"><img src="${MASCOT}" alt=""></div>
      <div class="bubble"><div>${tx(s.tut)}</div><div class="ctl">
        <button class="mini" id="hear">${T().hear}</button>
        <button class="mini" id="mute">${muted?T().unmute:T().mute}</button>
        <span class="vol" id="vol">${muted?T().off:""}</span></div></div></div>
    <div class="demo" id="dm"><button class="replay" id="rp">${T().replay}</button>${scene(s)}</div>
    <div class="foot"><button class="go" id="n">${T().got}</button>
      <button class="go ghost" id="d">${T().how} ▾</button>
      <span class="tick">${T().hidden}</span></div>`;
  say(tx(s.tut));
  $('hear').onclick=()=>say(tx(s.tut));
  $('mute').onclick=()=>{muted=!muted; if(muted)hush(); else say(tx(s.tut));
    $('mute').textContent=muted?T().unmute:T().mute; $('vol').textContent=muted?T().off:"";};
  bindReplay(s);
  $('n').onclick=()=>{hush();idx=0;combo=0;go(2);};
  $('d').onclick=()=>{ $('d').insertAdjacentHTML('afterend',
    `<div class="fix" style="flex-basis:100%"><b>${T().research}</b>${tx(s.sci)}</div>`);
    $('d').disabled=true; };
}
function bindReplay(s){ const b=$('rp'); if(!b)return;
  b.onclick=()=>{const o=$('dm'),f=document.createElement('div');
    f.className='demo';f.id='dm';
    f.innerHTML=`<button class="replay" id="rp">${T().replay}</button>${scene(s)}`;
    o.replaceWith(f);bindReplay(s);}; }

function scene(s){
  const c=i=>pick(i), cap=t=>`<div class="cap">${t}</div>`;
  const hand=(l,t)=>`<span class="d-hand" style="left:${l};top:${t};animation:dTap 3.4s .1s both">👆</span>`;
  if(s.kind==="order"){
    const st=s.steps.slice(0,4);
    return `${st.map((x,i)=>`<div class="d-slot" style="left:${12+i*21}%;top:46px;
      animation:dLand 3.4s ${.25+i*.42}s both"></div>`).join('')}
      ${st.map((x,i)=>`<span style="left:${12+i*21}%;top:46px;width:34px;height:34px;display:grid;
        place-items:center;font-size:17px;animation:dFly 3.4s ${.25+i*.42}s both">${x.e}</span>`).join('')}
      ${hand('14%','96px')}${cap(tx(s.goal))}`;
  }
  if(s.kind==="pick"){
    return `<div class="d-card" style="--dc:${c(0)};left:50%;top:22px;transform:translateX(-50%)">${tx(s.prompt)}</div>
      <div class="d-line" style="left:26%;top:66px;width:48%;animation:dDraw 3.4s .3s both"></div>
      <div class="d-card" style="--dc:${c(4)};left:22%;top:96px;font-size:11.5px;
        animation:dGlow 3.4s .9s both">✓</div>
      <div class="d-card" style="--dc:${c(2)};left:58%;top:96px;font-size:11.5px;
        animation:dIn 3.4s .5s both">?</div>
      ${hand('26%','88px')}${cap(T()[s.ask]||"")}`;
  }
  if(s.kind==="binary"){
    return `<span style="left:44%;top:28px;font-size:38px;animation:dIn 3.4s .2s both">${s.items[0].e}</span>
      <div class="d-card" style="--dc:${c(4)};left:14%;top:104px;animation:dGlow 3.4s 1.1s both">✓</div>
      <div class="d-card" style="--dc:${c(0)};left:64%;top:104px">✗</div>
      ${hand('18%','96px')}${cap(tx(s.q))}`;
  }
  if(s.kind==="chunk"){
    return `<div style="left:0;right:0;top:52px;text-align:center;font-size:26px;font-weight:800;
      color:#fff;animation:dSplit 3.4s .3s forwards">427 905 318</div>
      ${[0,1,2].map(i=>`<span style="left:${20+i*22}%;top:96px;font-size:11px;font-weight:800;
        color:#011049;background:${c(i)};padding:2px 8px;border-radius:99px;
        animation:dMark 3.4s ${1.2+i*.28}s both">1</span>`).join('')}${cap(tx(s.tut))}`;
  }
  if(s.kind==="letters"){
    const w=tx(s.word);
    return `${[...w].map((ch,i)=>`<div class="d-slot" style="left:${11+i*13}%;top:60px;
      animation:dLand 3.4s ${.2+i*.32}s both"></div>`).join('')}
      ${[...w].map((ch,i)=>`<span style="left:${11+i*13}%;top:60px;width:34px;height:34px;display:grid;
        place-items:center;font-weight:800;color:#011049;--fx:${(i%2?1:-1)*(30+i*9)}px;
        animation:dLetter 3.4s ${.2+i*.32}s both">${ch}</span>`).join('')}${cap(tx(s.clue))}`;
  }
  return cap(tx(s.tut));
}

function play(s,S){ return ({order,pick:pickQ,binary,chunk,letters})[s.kind](s,S); }
function total(s){ return (s.items||s.opts||s.steps||[1]).length; }
function next(){
  const s=L[path][lvl], t=total(s);
  idx++;
  if(idx>=t){ done[path+lvl]=true; go(5); }
  else if(idx===Math.ceil(t/2)&&step===2) go(3);
  else render();
}
function hit(ok){ ok?(combo++,best=Math.max(best,combo)):(combo=0); }
const tag=()=>combo>1?`<span class="combo">🔥 ${combo}×</span>`:'';

function order(s,S){
  const pool=[...s.steps,...(s.traps||[])], placed=s.steps.slice(0,idx);
  S.innerHTML=`<p class="lead">${idx}/${s.steps.length} ${tag()}</p>
    <p class="mid">${tx(s.goal)}</p>
    <div class="slots">${s.steps.map((x,i)=>
      `<div class="slot ${i<idx?'filled':''}">${i<idx?x.e:''}</div>`).join('')}</div>
    <p class="lead">${T().whatNext}</p>
    <div class="opts">${pool.filter(x=>!placed.includes(x)).sort(()=>Math.random()-.5)
      .map((x,i)=>`<button class="tile" style="--tc:${pick(i)}" data-x="${encodeURIComponent(tx(x.x))}">
        <em>${x.e}</em>${tx(x.x)}</button>`).join('')}</div>`;
  S.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    const v=decodeURIComponent(b.dataset.x), want=s.steps[idx], ok=v===tx(want.x);
    b.classList.add(ok?'ok':'no'); hit(ok);
    if(ok) setTimeout(next,tempo(640));
    else{ const wr=pool.find(x=>tx(x.x)===v); say(tx(wr.w));
      S.insertAdjacentHTML('beforeend',
        `<div class="fix"><b>${(s.traps||[]).some(t=>tx(t.x)===v)?T().notPart:T().notYet}</b>${tx(wr.w)}
         <div style="margin-top:6px;opacity:.8">→ <b>${want.e} ${tx(want.x)}</b></div>
         <div style="margin-top:8px"><button class="go" onclick="render()">${T().retry}</button></div></div>`); }
  });
}
function pickQ(s,S){
  S.innerHTML=`<p class="lead">${tag()}</p>
    <div class="card" style="text-align:center;font-size:19px;font-weight:650">${tx(s.prompt)}</div>
    <p class="lead">${T()[s.ask]||""}</p>
    <div class="opts">${s.opts.map((o,i)=>
      `<button class="tile" style="--tc:${pick(i)}" data-i="${i}">${tx(o.x)}</button>`).join('')}</div>`;
  S.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    const o=s.opts[+b.dataset.i]; hit(o.ok); b.classList.add(o.ok?'ok':'no'); say(tx(s.why));
    S.insertAdjacentHTML('beforeend',
      `<div class="fix"><b>${o.ok?"✓":"✗"}</b>${tx(s.why)}
       <div style="margin-top:8px"><button class="go" onclick="next()">${T().next}</button></div></div>`);
  });
}
function binary(s,S){
  const it=s.items[idx], free=!!s.binaryFree;
  S.innerHTML=`<p class="lead">${idx+1}/${s.items.length} ${ramp()?'· ⏩':''} ${tag()}</p>
    <div class="card" style="text-align:center">
      <div style="font-size:44px">${it.e}</div>
      <div style="font-size:18px;font-weight:650;margin-top:4px">${tx(it.n)}</div></div>
    <p class="mid" style="font-size:15px">${tx(s.q)}</p>
    <div class="opts row" style="margin-top:auto">
      <button class="tile" style="--tc:${pick(4)};flex:1;justify-content:center" data-v="1">
        ${free?T().remembered:T().yes}</button>
      <button class="tile" style="--tc:${pick(0)};flex:1;justify-content:center" data-v="0">
        ${free?T().forgot:T().no}</button></div>`;
  S.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    const said=b.dataset.v==="1";
    const ok=free?said:(said===it.a);
    hit(ok); b.classList.add(ok?'ok':'no');
    if(free&&!said){ say(tx(s.tut));
      S.insertAdjacentHTML('beforeend',
        `<div class="fix"><b>${T().notYet}</b>${tx(s.tut)}
         <div style="margin-top:8px"><button class="go" onclick="next()">${T().next}</button></div></div>`); }
    else setTimeout(next,tempo(640));
  });
}
function chunk(s,S){
  const d=s.digits,g=[d.slice(0,3),d.slice(3,6),d.slice(6)];
  S.innerHTML=`<p class="lead">${tag()}</p>
    <div class="slots" style="justify-content:center;gap:14px">${g.map((x,i)=>
      `<div class="slot filled" style="width:auto;padding:0 17px;font-size:27px;font-weight:800;
        background:${pick(i)};box-shadow:0 6px 0 -1px color-mix(in srgb,${pick(i)} 55%,#000)">${x}</div>`).join('')}</div>
    <div class="card" style="font-size:13.5px">${tx(s.tut)}</div>
    <div class="foot" style="margin-top:auto"><button class="go" id="n">${T().ready}</button>
      <span class="tick">${tempo(ramp()?9000:15000)/1000} ${T().sec}</span></div>`;
  $('n').onclick=()=>{hit(true);done[path+lvl]=true;go(5);};
}
function letters(s,S){
  const w=tx(s.word);
  S.innerHTML=`<p class="lead">${tag()}</p>
    <div class="card" style="text-align:center;font-size:19px">${tx(s.clue)}</div>
    <div class="slots" style="justify-content:center">${[...w].map((c,i)=>
      `<div class="slot" id="s${i}" style="width:42px;height:48px;font-size:18px;font-weight:800"></div>`).join('')}</div>
    <div class="opts row" style="justify-content:center">${[...w].sort(()=>Math.random()-.5)
      .map((c,i)=>`<button class="tile" style="--tc:${pick(i)};padding:10px 15px;font-weight:800"
        data-c="${c}">${c}</button>`).join('')}</div>`;
  let at=0;
  S.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(at>=w.length)return;
    if(b.dataset.c===w[at]){const sl=$('s'+at);sl.textContent=w[at];sl.classList.add('filled');
      b.classList.add('dim');at++;hit(true);
      if(at===w.length){done[path+lvl]=true;setTimeout(()=>go(5),tempo(620));}}
    else{b.classList.add('no');hit(false);setTimeout(()=>b.classList.remove('no'),360);}
  });
}
function reward(S){
  S.innerHTML=`<div class="conf">${Array.from({length:22},(_,i)=>
      `<s style="left:${4+i*4.3}%;background:${pick(i)};animation-delay:${i*.055}s"></s>`).join('')}</div>
    <div class="reward">
      <div class="mascot idle" style="width:104px;margin:0 auto 8px"><img src="${MASCOT}" alt=""></div>
      <p class="big" style="margin:4px 0 2px">${T().done}</p>
      <p class="lead">${T().streak}: ${best||1}×</p>
      <div class="meter"><i id="m"></i></div>
      <div class="foot" style="justify-content:center;margin-top:16px">
        <button class="go" id="again">${T().again}</button>
        <button class="go ghost" id="nx">${T().nextScene}</button></div>
      <div class="tick" style="margin:10px 0 0">${T().stop}</div></div>`;
  say(T().done);
  setTimeout(()=>{$('m').style.width='78%';},90);
  $('again').onclick=()=>{idx=0;combo=0;go(0);};
  $('nx').onclick=()=>{lvl=(lvl+1)%L[path].length;idx=0;combo=0;best=0;go(0);};
}

document.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]'),l=e.target.closest('[data-l]'),g=e.target.closest('.lang button');
  if(g&&g.dataset.l){ lang=g.dataset.l;
    document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
    idx=0;combo=0;best=0;go(step); return; }
  if(p){path=p.dataset.p;lvl=0;idx=0;combo=0;best=0;ambient();go(0);}
  if(l){lvl=+l.dataset.l;idx=0;combo=0;best=0;go(0);}
});
ambient(); go(0);
</script>
