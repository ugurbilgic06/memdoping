<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Badge ring -->
  <circle cx="512" cy="512" r="336" fill="none" stroke="#F5F3FF" stroke-width="28"/>

  <!-- Neuron network lines -->
  <g stroke="#F5F3FF" stroke-width="10" opacity="0.85">
    <line x1="512" y1="512" x2="392" y2="368"/>
    <line x1="512" y1="512" x2="632" y2="368"/>
    <line x1="512" y1="512" x2="330" y2="560"/>
    <line x1="512" y1="512" x2="694" y2="560"/>
    <line x1="512" y1="512" x2="440" y2="680"/>
    <line x1="512" y1="512" x2="584" y2="680"/>
  </g>

  <!-- Neuron nodes -->
  <g fill="#F5F3FF">
    <circle cx="392" cy="368" r="30"/>
    <circle cx="632" cy="368" r="30"/>
    <circle cx="330" cy="560" r="26"/>
    <circle cx="694" cy="560" r="26"/>
    <circle cx="440" cy="680" r="26"/>
    <circle cx="584" cy="680" r="26"/>
  </g>

  <!-- Center energy spark -->
  <polygon points="512,410 552,472 614,512 552,552 512,614 472,552 410,512 472,472"
           fill="#FFC93C"/>
</svg>
